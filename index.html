<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FF4F9A"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2096%2096%22%3E%3Crect%20width%3D%2296%22%20height%3D%2296%22%20rx%3D%2222%22%20fill%3D%22%23FF4F9A%22/%3E%3Cpath%20d%3D%22M22%2046%20L24%2014%20L46%2034%20Z%20M74%2046%20L72%2014%20L50%2034%20Z%22%20fill%3D%22%23FFF2E6%22%20stroke%3D%22%232A2D5A%22%20stroke-width%3D%224%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2256%22%20r%3D%2228%22%20fill%3D%22%23FFF2E6%22%20stroke%3D%22%232A2D5A%22%20stroke-width%3D%224%22/%3E%3Cellipse%20cx%3D%2238%22%20cy%3D%2254%22%20rx%3D%224.5%22%20ry%3D%226%22%20fill%3D%22%232A2D5A%22/%3E%3Cellipse%20cx%3D%2258%22%20cy%3D%2254%22%20rx%3D%224.5%22%20ry%3D%226%22%20fill%3D%22%232A2D5A%22/%3E%3Cpath%20d%3D%22M40%2067%20Q44%2072%2048%2067%20Q52%2072%2056%2067%22%20fill%3D%22none%22%20stroke%3D%22%232A2D5A%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M32%2026%20L20%2018%20L22%2034%20Z%20M32%2026%20L44%2018%20L42%2034%20Z%22%20fill%3D%22%233AAAF5%22%20stroke%3D%22%232A2D5A%22%20stroke-width%3D%223%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>Läxgympan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Lexend:wght@400;500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"></head><body><style>
/* Layout: gymnastiksal. Hem = scen med kompisen på mattan och medaljer som dinglar på en räcke, läxkorten bredvid.
   Pass = en bom överst som visar hur långt man kommit, frågekortet i mitten och kompisen vid sidan. */
:root{
  --bg:#FFF3F8; --surface:#FFFFFF; --surface2:#FFF8FB;
  --ink:#20244F; --muted:#5E628F; --line:#EBDDEB;
  --rosa:#FF4F9A; --rosa-deep:#D2307C; --rosa-soft:#FFDCEB;
  --bla:#3AAAF5; --bla-deep:#1572C4; --bla-soft:#D9EFFF;
  --navy:#24306F; --guld:#FFB51E; --guld-soft:#FFF1C9;
  --ratt:#12996A; --ratt-soft:#D3F4E5; --fel:#E2622D; --fel-soft:#FFE6DA;
  --bom:#EBCFA8; --bom-ben:#BFA488; --on-pop:#FFFFFF; --skugga:rgba(60,30,90,.13); --rod:#D7262E;
  --pop:var(--rosa); --pop-deep:var(--rosa-deep); --pop-soft:var(--rosa-soft);
  --pop2:var(--bla); --pop2-deep:var(--bla-deep); --pop2-soft:var(--bla-soft);
  --matta:var(--bla-soft); --matta-kant:var(--bla);
  --display:"Grandstander","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* Illustrationsfärger, lika i båda teman */
  --fur:#FFF2E6; --kontur:#2A2D5A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151730; --surface:#22264A; --surface2:#272C55;
    --ink:#F7F2FF; --muted:#AEB1DA; --line:#363C6E;
    --rosa:#FF6FAE; --rosa-deep:#FF85BC; --rosa-soft:#4A2650;
    --bla:#62C4FF; --bla-deep:#86D2FF; --bla-soft:#1E3B63;
    --navy:#A9BCFF; --guld:#FFC84A; --guld-soft:#4A3A14;
    --ratt:#43D894; --ratt-soft:#163E2F; --fel:#FF9468; --fel-soft:#4D2A1E;
    --bom:#8C6E52; --bom-ben:#6B5642; --on-pop:#1B1233; --skugga:rgba(0,0,0,.35); --rod:#FF6B70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151730; --surface:#22264A; --surface2:#272C55;
  --ink:#F7F2FF; --muted:#AEB1DA; --line:#363C6E;
  --rosa:#FF6FAE; --rosa-deep:#FF85BC; --rosa-soft:#4A2650;
  --bla:#62C4FF; --bla-deep:#86D2FF; --bla-soft:#1E3B63;
  --navy:#A9BCFF; --guld:#FFC84A; --guld-soft:#4A3A14;
  --ratt:#43D894; --ratt-soft:#163E2F; --fel:#FF9468; --fel-soft:#4D2A1E;
  --bom:#8C6E52; --bom-ben:#6B5642; --on-pop:#1B1233; --skugga:rgba(0,0,0,.35); --rod:#FF6B70;
  color-scheme:dark;
}
:root[data-skin="ljusbla"]{ --pop:var(--bla); --pop-deep:var(--bla-deep); --pop-soft:var(--bla-soft); --pop2:var(--rosa); --pop2-deep:var(--rosa-deep); --pop2-soft:var(--rosa-soft); --matta:var(--rosa-soft); --matta-kant:var(--rosa); }
:root[data-skin="dif"]{ --pop:var(--bla); --pop-deep:var(--bla-deep); --pop-soft:var(--bla-soft); --pop2:var(--guld); --pop2-deep:var(--ink); --pop2-soft:var(--guld-soft); }
:root[data-skin="dif"] .matta{background:repeating-linear-gradient(90deg,var(--bla) 0 26px,var(--guld) 26px 52px,var(--rod) 52px 78px);box-shadow:inset 0 -7px 0 rgba(0,0,0,.18)}
:root[data-skin="dif"] .namnskylt{background:var(--rod);box-shadow:0 3px 0 color-mix(in srgb,var(--rod) 60%,#000)}
:root[data-skin="dif"] .rack::before{background:linear-gradient(90deg,var(--bla),var(--guld),var(--rod))}
:root[data-skin="randig"]{ --pop:var(--bla); --pop-deep:var(--navy); --pop-soft:var(--bla-soft); --pop2:var(--rosa); --pop2-deep:var(--rosa-deep); --pop2-soft:var(--rosa-soft); }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
:focus-visible{outline:3px solid var(--pop2);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}

.app{height:100%;position:relative;isolation:isolate}
.app::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 40% at 0% 0%,var(--pop-soft),transparent 70%),radial-gradient(50% 38% at 100% 100%,var(--pop2-soft),transparent 72%)}
.vy{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;animation:vyIn .35s cubic-bezier(.2,.9,.3,1.2)}
.inre{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:20px}
@keyframes vyIn{from{opacity:.0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}

/* ---------- Knappar ---------- */
.knapp{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:0 26px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:21px;background:var(--pop-deep);color:var(--on-pop);box-shadow:0 5px 0 color-mix(in srgb,var(--pop-deep) 62%,#000),0 10px 22px var(--skugga);transition:transform .16s cubic-bezier(.3,1.6,.5,1),box-shadow .16s}
.knapp:active{transform:translateY(4px) scale(.98);box-shadow:0 1px 0 color-mix(in srgb,var(--pop-deep) 62%,#000),0 4px 10px var(--skugga)}
.knapp.sek{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line),0 8px 18px var(--skugga)}
.knapp.tips{background:var(--guld-soft);color:var(--ink);box-shadow:0 4px 0 color-mix(in srgb,var(--guld) 55%,transparent),0 8px 18px var(--skugga)}
.knapp[disabled]{opacity:.45;pointer-events:none}
.knapp svg{width:24px;height:24px;flex:none}
.ikon-knapp{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:0 3px 0 var(--line),0 6px 14px var(--skugga);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.ikon-knapp:active{transform:scale(.9)}
.ikon-knapp svg{width:26px;height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;padding:7px 11px;border-radius:999px;white-space:nowrap}
.chip.matte{background:var(--rosa-soft);color:var(--rosa-deep)}
.chip.no{background:var(--bla-soft);color:var(--bla-deep)}
.chip.papper{background:var(--guld-soft);color:var(--ink);text-transform:none;letter-spacing:0;font-size:14px}
.chip svg{width:16px;height:16px}

/* ---------- Bråk ---------- */
.br{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.82em;margin:0 .14em;font-variant-numeric:tabular-nums;font-weight:inherit}
.br>span{display:block;padding:0 .18em}
.br>span:first-child{border-bottom:2px solid currentColor;padding-bottom:.06em}
.br>span:last-child{padding-top:.06em}

/* ---------- Hem ---------- */
.topp{display:flex;align-items:center;gap:12px}
.halsning{flex:1;min-width:0}
.halsning h1{overflow-wrap:anywhere}
.halsning h1{font-size:clamp(32px,5.5vw,48px);color:var(--ink)}
.halsning h1 em{font-style:normal;color:var(--pop-deep)}
.halsning p{color:var(--muted);font-size:18px;margin-top:4px}
.stjarnor{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 18px 0 12px;border-radius:999px;background:var(--guld-soft);font:800 24px var(--display);font-variant-numeric:tabular-nums;box-shadow:0 3px 0 color-mix(in srgb,var(--guld) 50%,transparent)}
.stjarnor svg{width:30px;height:30px}
.stjarnor.pop svg{animation:stjarnPop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes stjarnPop{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.5) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}

.hem-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:880px){.hem-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}

.scen{position:relative;background:var(--surface);border-radius:30px;padding:16px 18px 20px;box-shadow:0 2px 0 var(--line),0 14px 34px var(--skugga);display:flex;flex-direction:column;gap:12px;overflow:hidden}
.rack{position:relative;height:112px;margin:0 -4px}
.rack::before{content:"";position:absolute;left:4px;right:4px;top:10px;height:10px;border-radius:6px;background:linear-gradient(var(--bom),color-mix(in srgb,var(--bom) 70%,#000))}
.rack-hangen{position:absolute;left:0;right:0;top:14px;display:flex;justify-content:center;gap:clamp(6px,2vw,16px);padding:0 12px}
.hang{width:52px;height:92px;transform-origin:50% 0;display:block}
.hang svg{width:100%;height:100%;overflow:visible}
.hang.dangla{animation:dangla 1.8s cubic-bezier(.3,.7,.4,1)}
.hang.tom{opacity:.5}
@keyframes dangla{0%{transform:rotate(0)}10%{transform:rotate(22deg)}26%{transform:rotate(-17deg)}42%{transform:rotate(11deg)}58%{transform:rotate(-7deg)}74%{transform:rotate(4deg)}88%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.rack-text{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:var(--muted);font-size:14px}

.kompis-scen{position:relative;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;padding-top:8px}
.pratbubbla{position:relative;justify-self:stretch;background:var(--pop2-soft);color:var(--ink);border-radius:22px;padding:14px 16px;font-size:18px;font-weight:500;margin-bottom:12px;animation:bubbla .5s cubic-bezier(.3,1.6,.5,1)}
.pratbubbla::after{content:"";position:absolute;left:50%;bottom:-12px;width:24px;height:24px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:4px}
@keyframes bubbla{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.pratbubbla form{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.pratbubbla input{font:500 19px var(--body);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.pratbubbla .forslag{display:flex;flex-wrap:wrap;gap:8px}
.pratbubbla .forslag button{padding:8px 14px;border-radius:999px;background:var(--surface);font-weight:600;box-shadow:0 2px 0 var(--line)}
.kompis-knapp{width:min(240px,62vw);display:block;position:relative;z-index:1}
.matta{width:86%;height:44px;margin-top:-34px;border-radius:16px;background:var(--matta);box-shadow:inset 0 -7px 0 var(--matta-kant)}
:root[data-skin="randig"] .matta{background:repeating-linear-gradient(90deg,var(--bla) 0 28px,var(--navy) 28px 56px);box-shadow:inset 0 -7px 0 rgba(0,0,0,.18)}
.namnskylt{margin-top:-14px;position:relative;z-index:2;background:var(--pop-deep);color:var(--on-pop);font:800 18px var(--display);padding:6px 16px;border-radius:999px;box-shadow:0 3px 0 color-mix(in srgb,var(--pop-deep) 60%,#000)}
.rorelser{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rorelse{padding:9px 14px;border-radius:999px;background:var(--pop-soft);color:var(--pop-deep);font-weight:700;font-size:15px;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.rorelse:active{transform:scale(.9)}
.rorelse.last{background:transparent;color:var(--muted);border:2px dashed var(--line);font-weight:500}
.nasta-rorelse{text-align:center;color:var(--muted);font-size:14px}

.laxor{display:flex;flex-direction:column;gap:14px}
.laxor h2{font-size:26px}
.laxkort{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:24px;padding:16px 18px;box-shadow:0 3px 0 var(--line),0 12px 26px var(--skugga);transition:transform .2s cubic-bezier(.3,1.6,.5,1);animation:kortIn .5s cubic-bezier(.2,1.2,.4,1) both}
.laxkort:active{transform:scale(.97) rotate(-.6deg)}
.laxkort:nth-child(2){animation-delay:.05s}.laxkort:nth-child(3){animation-delay:.1s}.laxkort:nth-child(4){animation-delay:.15s}.laxkort:nth-child(5){animation-delay:.2s}
@keyframes kortIn{from{transform:translateY(16px);opacity:.3}to{transform:none;opacity:1}}
.amnesruta{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font:800 26px var(--display)}
.amnesruta.matte{background:var(--rosa-soft);color:var(--rosa-deep)}
.amnesruta.no{background:var(--bla-soft);color:var(--bla-deep)}
.amnesruta.igen{background:var(--guld-soft);color:var(--ink)}
.amnesruta svg{width:34px;height:34px}
.laxkort h3{font-size:22px}
.laxkort p{color:var(--muted);font-size:15px;margin-top:2px}
.laxkort .rad{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ring{width:54px;height:54px}
.ring text{font:700 13px var(--body);fill:var(--ink)}
.ring .bak{stroke:var(--line)}
.ring .fram{stroke:var(--pop);transition:stroke-dashoffset .8s}

/* ---------- Läxa (stationer) ---------- */
.setvy-topp{display:flex;gap:14px;align-items:center}
.setvy-topp h1{font-size:clamp(28px,5vw,40px)}
.setvy-topp p{color:var(--muted)}
.stationer{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;position:relative}
.stationer::before{content:"";position:absolute;left:44px;top:30px;bottom:30px;border-left:4px dashed var(--pop-soft)}
.station{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:0 3px 0 var(--line),0 10px 22px var(--skugga);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.station:active{transform:scale(.97)}
.station .nr{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--pop-soft);color:var(--pop-deep);font:800 24px var(--display)}
.station.gen .nr{background:var(--pop2-soft);color:var(--pop2-deep)}
.station.klar .nr{background:var(--pop-deep);color:var(--on-pop)}
.station .nr svg{width:28px;height:28px}
.station h3{font-size:20px}
.station p{color:var(--muted);font-size:15px}
.station .mini-medalj{width:34px;height:56px}
.station .kor{font:800 18px var(--display);color:var(--pop-deep);display:flex;align-items:center;gap:4px}

/* ---------- Pass ---------- */
.pass-topp{display:flex;align-items:center;gap:14px}
.bom{position:relative;flex:1;height:58px}
.bom-yta{position:absolute;left:0;right:0;top:26px;height:16px;border-radius:8px;background:var(--bom);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.bom-fyll{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--pop);transition:width .55s cubic-bezier(.3,1.2,.5,1)}
.bom::before,.bom::after{content:"";position:absolute;top:42px;width:12px;height:14px;background:var(--bom-ben);border-radius:0 0 4px 4px}
.bom::before{left:10%}.bom::after{right:10%}
.bom-prickar{position:absolute;left:8px;right:8px;top:30px;display:flex;justify-content:space-between;pointer-events:none}
.bom-prickar i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.65)}
.bom-prickar i.ratt{background:var(--ratt)}.bom-prickar i.ratt2{background:var(--guld)}.bom-prickar i.miss{background:var(--fel)}
.bom-kompis{position:absolute;top:-2px;width:38px;height:34px;transform:translateX(-50%);transition:left .6s cubic-bezier(.4,1.4,.5,1)}
.bom-kompis.hoppa{animation:miniHopp .6s cubic-bezier(.3,.7,.4,1)}
@keyframes miniHopp{0%,100%{translate:0 0}45%{translate:0 -14px}}
.raknare{font:800 20px var(--display);font-variant-numeric:tabular-nums;color:var(--muted);min-width:56px;text-align:right}

.pass-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:760px){.pass-grid{grid-template-columns:minmax(0,1fr) 180px}}
.pass-kompis{display:none}
@media (min-width:760px){.pass-kompis{display:flex;flex-direction:column;align-items:center;gap:6px;position:sticky;top:10px}}
.pass-kompis .kompis-knapp{width:100%}
.pass-kompis .matta{width:100%;height:34px;margin-top:-26px}
.fraga-kort{position:relative;background:var(--surface);border-radius:30px;padding:clamp(18px,3vw,30px);box-shadow:0 3px 0 var(--line),0 16px 36px var(--skugga);display:flex;flex-direction:column;gap:18px;min-width:0}
.fraga-kort.in{animation:fragaIn .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes fragaIn{from{transform:translateX(40px) rotate(1.5deg);opacity:0}to{transform:none;opacity:1}}
.fraga-kort.skaka{animation:skaka .45s}
@keyframes skaka{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.fraga-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fraga-meta .las{margin-left:auto}
.liten-kompis{display:block;width:74px;margin:-10px 0 -6px}
@media (min-width:760px){.liten-kompis{display:none}}
.fraga-text{font-family:var(--body);font-weight:600;font-size:clamp(21px,3.2vw,28px);line-height:1.35;text-wrap:pretty;max-width:36ch}
.uttryck{font:800 clamp(30px,6vw,46px)/1.3 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em;color:var(--pop-deep);overflow-x:auto}
.uttryck .lucka{display:inline-grid;place-items:center;min-width:1.2em;height:1.15em;border-radius:10px;background:var(--pop-soft);font-size:.8em;vertical-align:middle}
.figur{display:flex;justify-content:center;overflow-x:auto;padding:4px 0}
.figur svg{max-width:100%;height:auto}
.fig-del{fill:var(--surface);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.fig-del.farg{fill:var(--pop)}
.tl-linje{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.tl-streck{stroke:var(--ink);stroke-width:2}
.tl-text{fill:var(--ink);font:600 18px var(--body);text-anchor:middle}
.tl-pil{fill:var(--pop-deep)}
.tl-pilnamn{fill:var(--pop-deep);font:800 20px var(--display);text-anchor:middle}

/* Flerval */
.alternativ{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.alt{display:flex;align-items:center;gap:14px;min-height:72px;padding:12px 18px;border-radius:20px;background:var(--surface2);border:3px solid var(--line);text-align:left;font-size:21px;font-weight:600;transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .2s,border-color .2s}
.alt:active{transform:scale(.96)}
.alt .bokstav{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pop-soft);color:var(--pop-deep);font:800 20px var(--display)}
.alt.ratt{background:var(--ratt-soft);border-color:var(--ratt);animation:studs .5s cubic-bezier(.3,1.8,.5,1)}
.alt.ratt .bokstav{background:var(--ratt);color:#fff}
.alt.fel{background:var(--fel-soft);border-color:var(--fel);opacity:.75;animation:skaka .4s}
.alt.fel .bokstav{background:var(--fel);color:#fff}
.alt[disabled]{pointer-events:none}
@keyframes studs{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

/* Skriv svaret */
.falten{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.falt{display:flex;flex-direction:column;gap:6px;text-align:left}
.falt .etikett{font-weight:600;font-size:17px;color:var(--muted);min-height:1.4em}
.falt .ruta{display:flex;align-items:center;gap:8px;min-height:64px;padding:0 16px;border-radius:18px;border:3px solid var(--line);background:var(--surface2);font:700 28px var(--display);font-variant-numeric:tabular-nums;transition:border-color .2s,box-shadow .2s}
.falt .ruta .tomt{color:var(--muted);opacity:.5}
.falt .ruta .enhet{margin-left:auto;font:600 18px var(--body);color:var(--muted)}
.falt.aktiv .ruta{border-color:var(--pop);box-shadow:0 0 0 5px var(--pop-soft)}
.falt.aktiv .ruta::after{content:"";width:3px;height:30px;background:var(--pop);border-radius:2px;animation:blink 1s steps(1) infinite;order:1}
.falt.aktiv .ruta .enhet{order:2}
@keyframes blink{50%{opacity:0}}
.falt.ok .ruta{border-color:var(--ratt);background:var(--ratt-soft)}
.falt.nej .ruta{border-color:var(--fel);background:var(--fel-soft);animation:skaka .4s}
.falt input{font:600 24px var(--body);min-height:64px;padding:0 16px;border-radius:18px;border:3px solid var(--line);background:var(--surface2);color:var(--ink);width:100%}
.falt input:focus{outline:none;border-color:var(--pop);box-shadow:0 0 0 5px var(--pop-soft)}
.tangenter{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;width:100%;margin:0 auto}
.tangenter.med-snedstreck{grid-template-columns:repeat(4,1fr);max-width:520px}
.tangent{min-height:62px;border-radius:18px;background:var(--surface2);font:800 28px var(--display);box-shadow:0 4px 0 var(--line);transition:transform .1s}
.tangent:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);background:var(--pop-soft)}
.tangent.extra{background:var(--pop-soft);color:var(--pop-deep)}
.tangent svg{width:28px;height:28px;vertical-align:middle}

/* Ordna */
.ordna{display:flex;flex-direction:column;gap:14px}
.ordna-rad{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;border-radius:20px;background:var(--surface2);border:3px dashed var(--line)}
.ordna-rad .rand{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.plats{min-width:64px;min-height:70px;border-radius:16px;border:3px solid var(--line);display:grid;place-items:center;font:700 26px var(--body);background:var(--surface)}
.plats.fylld{border-color:var(--pop);animation:studs .4s cubic-bezier(.3,1.8,.5,1)}
.ordna-pool{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:74px}
.bricka{min-width:64px;min-height:70px;padding:0 10px;border-radius:16px;background:var(--pop-soft);color:var(--ink);font:700 26px var(--body);box-shadow:0 4px 0 color-mix(in srgb,var(--pop) 40%,transparent);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.bricka:active{transform:scale(.9) rotate(-4deg)}

/* Pilkast */
.pilkast{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:center;justify-items:center}
@media (min-width:640px){.pilkast{grid-template-columns:minmax(0,300px) minmax(0,1fr)}}
.tavla{width:min(300px,100%);touch-action:manipulation;cursor:crosshair;filter:drop-shadow(0 10px 18px var(--skugga))}
.tavla .pilen{animation:pilIn .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pilIn{from{transform:scale(2.4);opacity:0}to{transform:none;opacity:1}}
.tavla .pilen{transform-box:fill-box;transform-origin:center}
.pil-info{display:flex;flex-direction:column;gap:12px;width:100%}
.traffar{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.traffar span{padding:8px 12px;border-radius:12px;background:var(--surface2);border:2px solid var(--line);font:800 20px var(--display)}
.pil-summa{font:800 26px var(--display);font-variant-numeric:tabular-nums}
.pil-summa small{font:500 16px var(--body);color:var(--muted)}
.pil-knappar{display:flex;gap:10px;flex-wrap:wrap}
.pil-knappar .knapp{min-height:48px;font-size:17px;padding:0 18px}

/* Kort */
.kort-hjalp{color:var(--muted);font-size:17px;display:flex;gap:10px;align-items:flex-start}
.kort-hjalp svg{width:26px;height:26px;flex:none;margin-top:2px}
.kort-svar{background:var(--pop2-soft);border-radius:20px;padding:16px 18px;font-size:20px;line-height:1.5;animation:vand .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes vand{from{transform:perspective(600px) rotateX(-70deg);opacity:0}to{transform:none;opacity:1}}
.kort-svar b{color:var(--pop2-deep)}
.bedom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bedom button{min-height:70px;border-radius:18px;font:800 18px var(--display);padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.bedom button:active{transform:scale(.94)}
.bedom small{font:500 13px var(--body);opacity:.8}
.bedom .kunde{background:var(--ratt-soft);color:var(--ink)}
.bedom .nastan{background:var(--guld-soft);color:var(--ink)}
.bedom .inte{background:var(--fel-soft);color:var(--ink)}

/* Återkoppling */
.aterkoppling{display:flex;flex-direction:column;gap:12px}
.aterkoppling:empty{display:none}
.besked{display:flex;align-items:center;gap:12px;border-radius:18px;padding:14px 16px;font-size:19px;font-weight:600;animation:bubbla .4s cubic-bezier(.3,1.6,.5,1)}
.besked svg{width:30px;height:30px;flex:none}
.besked.ratt{background:var(--ratt-soft)}
.besked.ratt strong{font:800 24px var(--display);color:var(--ratt)}
.besked.fel{background:var(--fel-soft)}
.besked.info{background:var(--pop2-soft)}
.plus{margin-left:auto;font:800 22px var(--display);color:var(--ink);display:inline-flex;align-items:center;gap:4px;animation:flyt 1s cubic-bezier(.2,1.4,.4,1)}
.plus svg{width:24px;height:24px}
@keyframes flyt{from{transform:translateY(18px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.ledtradsruta{display:flex;gap:12px;background:var(--guld-soft);border-radius:18px;padding:14px 16px;font-size:18px;animation:bubbla .4s cubic-bezier(.3,1.6,.5,1)}
.ledtradsruta svg{width:28px;height:28px;flex:none}
.losning{border:3px dashed var(--line);border-radius:20px;padding:14px 16px;background:var(--surface2)}
.losning h3{font-size:19px;margin-bottom:8px}
.losning ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:steg}
.losning li{counter-increment:steg;display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.5;animation:stegIn .4s both}
.losning li::before{content:counter(steg);flex:none;width:30px;height:30px;border-radius:50%;background:var(--pop2-soft);color:var(--pop2-deep);font:800 16px var(--display);display:grid;place-items:center;margin-top:1px}
.losning li:nth-child(2){animation-delay:.25s}.losning li:nth-child(3){animation-delay:.5s}.losning li:nth-child(4){animation-delay:.75s}.losning li:nth-child(5){animation-delay:1s}
@keyframes stegIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.facit{font-weight:600;font-size:19px;padding:10px 0 0}
.knapp-rad{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.knapp-rad .knapp.nasta{animation:nastaPuls 1.6s ease-in-out infinite}
@keyframes nastaPuls{0%,100%{transform:none}50%{transform:scale(1.04)}}

/* ---------- Klar ---------- */
.klar{align-items:center;text-align:center}
.klar-medalj{width:130px;height:210px;transform-origin:50% 0;animation:medaljFall 1.4s cubic-bezier(.3,.9,.4,1.2) both}
.klar-medalj.dangla{animation:dangla 1.8s cubic-bezier(.3,.7,.4,1)}
@keyframes medaljFall{0%{transform:translateY(-120%) rotate(0)}45%{transform:translateY(0) rotate(14deg)}65%{transform:rotate(-9deg)}82%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.klar h1{font-size:clamp(40px,8vw,64px);color:var(--pop-deep)}
.klar .under{color:var(--muted);font-size:19px;max-width:40ch}
.domare{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tavla-domare{width:104px;padding:12px 6px 10px;border-radius:16px;background:#1D2250;color:#FFE27A;box-shadow:0 6px 0 #0F1233,0 12px 24px var(--skugga);animation:vandUpp .6s cubic-bezier(.2,1.4,.4,1) both}
.tavla-domare:nth-child(2){animation-delay:.25s}.tavla-domare:nth-child(3){animation-delay:.5s}
.tavla-domare b{display:block;font:800 36px/1 var(--display);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,226,122,.55)}
.tavla-domare span{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#C9CCF5}
@keyframes vandUpp{from{transform:perspective(500px) rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.klar-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.klar-stats span{background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;box-shadow:0 3px 0 var(--line);display:inline-flex;gap:6px;align-items:center}
.klar-stats svg{width:22px;height:22px}
.ny-rorelse{background:var(--pop-soft);border-radius:22px;padding:14px 18px;font-size:19px;font-weight:600;max-width:520px;animation:bubbla .5s .9s both cubic-bezier(.3,1.6,.5,1)}
.ny-rorelse strong{font-family:var(--display);color:var(--pop-deep);font-size:22px}
.klar .kompis-knapp{width:min(200px,50vw)}
.klar-knappar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* ---------- Inställningar ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(20,16,50,.45);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.panel{width:min(560px,100%);max-height:calc(100% - 20px);overflow-y:auto;background:var(--surface);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:bubbla .35s cubic-bezier(.3,1.5,.5,1)}
.panel h2{font-size:28px}
.panel label{display:flex;flex-direction:column;gap:6px;font-weight:600}
.panel label small{font-weight:400;color:var(--muted)}
.panel input[type=text]{font:500 19px var(--body);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--ink)}
.teman{display:flex;gap:10px;flex-wrap:wrap}
.tema{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;border:3px solid var(--line);font-weight:600}
.tema[aria-pressed="true"]{border-color:var(--pop)}
.tema i{width:32px;height:32px;border-radius:50%;display:block}
.tema.rosa i{background:linear-gradient(135deg,#FF4F9A 50%,#3AAAF5 50%)}
.tema.ljusbla i{background:linear-gradient(135deg,#3AAAF5 50%,#FF4F9A 50%)}
.tema.randig i{background:repeating-linear-gradient(90deg,#3AAAF5 0 8px,#24306F 8px 16px)}
.tema.dif i{background:conic-gradient(#2C8BE6 0 33%,#FFC629 0 66%,#D7262E 0)}
.vaxel{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.vaxel button{width:64px;height:36px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.vaxel button::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:var(--surface);box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.vaxel button[aria-pressed="true"]{background:var(--ratt)}
.vaxel button[aria-pressed="true"]::after{transform:translateX(28px)}
.farozon{border-top:2px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.farozon p{color:var(--muted);font-size:15px}
.farozon .rad{display:flex;gap:10px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toast 2.6s both;max-width:calc(100% - 32px);text-align:center}
@keyframes toast{0%{transform:translate(-50%,30px);opacity:0}10%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,10px);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* ---------- Kompisen ---------- */
.kompis{display:block;width:100%;height:auto;overflow:visible}
.kompis .k-hel{transform-box:view-box;transform-origin:80px 180px;animation:andas 3.4s ease-in-out infinite}
.kompis .k-huvud{transform-box:view-box;transform-origin:80px 100px}
.kompis .k-ogon{transform-box:fill-box;transform-origin:center;transition:transform .08s}
.kompis.blink .k-ogon{transform:scaleY(.12)}
.kompis .k-arm-v{transform-box:view-box;transform-origin:60px 112px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.kompis .k-arm-h{transform-box:view-box;transform-origin:100px 112px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.kompis .k-band{transform-box:view-box;transform-origin:122px 102px}
.kompis .k-ben-v{transform-box:view-box;transform-origin:71px 144px}
.kompis .k-ben-h{transform-box:view-box;transform-origin:89px 144px}
.kompis .k-skugga{transform-box:fill-box;transform-origin:center}
.kompis .m{display:none}
.kompis[data-min="glad"] .m-glad,.kompis[data-min="jubel"] .m-jubel,.kompis[data-min="hmm"] .m-hmm{display:inline}
.kompis[data-min="jubel"] .k-arm-v{transform:rotate(110deg)}
.kompis[data-min="jubel"] .k-arm-h{transform:rotate(-55deg)}
@keyframes andas{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2px) scale(1.012,1.02)}}
.kompis.r-tap .k-hel{animation:wobbla .7s cubic-bezier(.3,.7,.4,1)}
@keyframes wobbla{0%{transform:rotate(0)}15%{transform:rotate(-9deg) scale(1.04,.96)}35%{transform:rotate(7deg)}55%{transform:rotate(-4deg)}75%{transform:rotate(2deg)}100%{transform:rotate(0)}}
.kompis.r-hopp .k-hel{animation:hopp .85s cubic-bezier(.3,.7,.4,1)}
.kompis.r-hopp .k-skugga,.kompis.r-volt .k-skugga,.kompis.r-splitt .k-skugga{animation:skugga .85s}
@keyframes hopp{0%{transform:none}18%{transform:scale(1.1,.86)}45%{transform:translateY(-60px) scale(.94,1.08)}62%{transform:translateY(-60px)}86%{transform:translateY(0) scale(1.1,.88)}100%{transform:none}}
@keyframes skugga{0%,100%{transform:none;opacity:1}45%,62%{transform:scale(.6);opacity:.5}}
.kompis.r-piruett .k-hel{animation:piruett 1.1s ease-in-out}
@keyframes piruett{0%{transform:none}12%{transform:translateY(-10px) scaleX(1)}25%{transform:translateY(-16px) scaleX(-1)}38%{transform:translateY(-16px) scaleX(1)}51%{transform:translateY(-16px) scaleX(-1)}64%{transform:translateY(-16px) scaleX(1)}77%{transform:translateY(-10px) scaleX(-1)}90%{transform:translateY(0) scaleX(1)}100%{transform:none}}
.kompis.r-volt .k-hel{transform-origin:80px 110px;animation:volt 1s cubic-bezier(.3,.7,.4,1)}
@keyframes volt{0%{transform:translateY(0) rotate(0deg) scale(1,1)}15%{transform:translateY(0) rotate(0deg) scale(1.1,.85)}30%{transform:translateY(-60px) rotate(-90deg) scale(.95,1.05)}50%{transform:translateY(-85px) rotate(-180deg) scale(1,1)}70%{transform:translateY(-60px) rotate(-270deg) scale(1,1)}86%{transform:translateY(0) rotate(-360deg) scale(1.08,.9)}100%{transform:translateY(0) rotate(-360deg) scale(1,1)}}
.kompis.r-hjula .k-hel{transform-origin:80px 110px;animation:hjula 1.6s cubic-bezier(.45,.1,.4,1)}
@keyframes hjula{0%{transform:translateX(0) rotate(0deg)}45%{transform:translateX(70px) rotate(360deg)}55%{transform:translateX(70px) rotate(360deg)}100%{transform:translateX(0) rotate(0deg)}}
.kompis.r-splitt .k-hel{animation:hopp .85s cubic-bezier(.3,.7,.4,1)}
.kompis.r-splitt .k-ben-v{animation:splittV .85s}
.kompis.r-splitt .k-ben-h{animation:splittH .85s}
.kompis.r-splitt .k-arm-v{transform:rotate(110deg)}
.kompis.r-splitt .k-arm-h{transform:rotate(-55deg)}
@keyframes splittV{0%,25%,85%,100%{transform:none}45%,62%{transform:rotate(62deg)}}
@keyframes splittH{0%,25%,85%,100%{transform:none}45%,62%{transform:rotate(-62deg)}}
.kompis.r-band .k-band{animation:band 1.3s cubic-bezier(.4,.1,.4,1)}
.kompis.r-band .k-arm-h{transform:rotate(-55deg)}
.kompis.r-band .k-hel{animation:piruett 1.3s ease-in-out}
@keyframes band{0%{transform:none}100%{transform:rotate(720deg)}}
.kompis.r-hmm .k-huvud{animation:hmm 1.1s ease-in-out}
@keyframes hmm{0%,100%{transform:none}25%,75%{transform:rotate(-11deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- Figurerna: val, publik, apor i räcket, domare ---------- */
.kompis .k-effekt,.kompis .k-fraga{opacity:0;pointer-events:none}
.kompis[data-min="jubel"] .k-effekt{opacity:1;animation:gnistra .9s cubic-bezier(.3,1.6,.5,1)}
.kompis .k-effekt{transform-box:view-box;transform-origin:80px 70px}
@keyframes gnistra{from{transform:scale(.3) rotate(-20deg)}to{transform:none}}
.kompis .k-fraga{font:800 44px var(--display);fill:var(--pop-deep)}
.kompis[data-min="hmm"] .k-fraga{opacity:1;animation:bubbla .4s cubic-bezier(.3,1.6,.5,1)}
.figur-val{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.figur-knapp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;border-radius:20px;background:var(--surface2);border:3px solid var(--line);font-weight:700;font-size:15px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.figur-knapp:active{transform:scale(.94)}
.figur-knapp[aria-pressed="true"]{border-color:var(--pop);background:var(--pop-soft)}
.figur-knapp .kompis{width:100%;max-width:120px}
.panel .figur-knapp .kompis{max-width:84px}
.scen-golv{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;width:100%;position:relative;z-index:1}
.scen-golv .kompis-knapp{width:min(220px,44vw)}
.publik{display:flex;align-items:flex-end;gap:2px;min-width:0}
.publik.v{justify-content:flex-end}.publik.h{justify-content:flex-start}
.publik-fig{width:clamp(66px,16vw,112px);display:block;margin-bottom:-6px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.publik-fig:active{transform:scale(.92)}
.rack.med-apor{height:172px}
.hangare{position:absolute;top:8px;width:66px;transform-origin:50% 4px;animation:sving 4.5s ease-in-out infinite;z-index:2}
.hangare.v{left:6px}.hangare.h{right:6px;animation-delay:-2.2s}
.hangare svg{width:100%;height:auto;display:block;overflow:visible}
.hangare.gungar{animation:gunga 1.9s cubic-bezier(.3,.7,.4,1)}
@keyframes sving{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes gunga{0%{transform:rotate(0)}12%{transform:rotate(38deg)}28%{transform:rotate(-30deg)}44%{transform:rotate(20deg)}60%{transform:rotate(-12deg)}76%{transform:rotate(6deg)}100%{transform:rotate(0)}}
.rack.med-apor .rack-hangen{left:76px;right:76px}
.rack.med-apor .rack-text{left:76px;right:76px}
.domare-plats{display:flex;flex-direction:column;align-items:center;gap:0}
.domare-fig{width:96px;display:block;margin-bottom:-14px;position:relative;z-index:1}
.domare-fig .kompis .k-skugga{display:none}
.tavla-domare span{display:block;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:480px){.hang{width:42px;height:76px}.figur-val{gap:6px}.figur-knapp{font-size:13px}}

/* ---------- Bonusspel ---------- */
.spel-knapp{background:var(--guld);color:#2B2100;box-shadow:0 5px 0 color-mix(in srgb,var(--guld) 55%,#000),0 10px 22px var(--skugga);animation:nastaPuls 1.6s ease-in-out infinite}
.spelvy{display:flex;flex-direction:column;overflow:hidden}
.spel-topp{display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 12px}
.spel-tid{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden;min-width:60px}
#spel-tidfyll{height:100%;width:0;background:var(--pop);border-radius:7px}
.spel-hjartan{display:flex;gap:2px}.spel-hjartan svg{width:28px;height:28px}
.spel-stj{display:inline-flex;align-items:center;gap:4px;font:800 22px var(--display);font-variant-numeric:tabular-nums;background:var(--guld-soft);padding:4px 12px 4px 6px;border-radius:999px}
.spel-stj svg{width:26px;height:26px}
.spelplan{position:relative;flex:1;min-height:320px;margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px));margin-bottom:16px;border-radius:28px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 var(--line),0 14px 30px var(--skugga);background:var(--surface)}
.spelplan.skaka{animation:skaka .4s}
#spelduk{position:absolute;inset:0;width:100%;height:100%;display:block}
.spel-figur{position:absolute;left:0;top:0;will-change:transform;pointer-events:none;z-index:2}
.spel-figur .kompis{width:100%}
.spel-figur.skyddad{animation:blinkFig .24s steps(2) infinite}
@keyframes blinkFig{50%{opacity:.25}}
.spel-overlay{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 62%,transparent)}
.spel-ruta{background:var(--surface);border-radius:26px;padding:22px;max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 18px 44px var(--skugga);animation:bubbla .4s cubic-bezier(.3,1.6,.5,1)}
.spel-ruta h2{font-size:30px;color:var(--pop-deep)}
.spel-ruta p{font-size:18px}
.spel-liten{color:var(--muted);font-size:15px!important}
.spel-resultat{display:inline-flex;align-items:center;gap:6px;font:800 30px var(--display)}
.spel-resultat svg{width:34px;height:34px}

.spel-paus{font:800 18px var(--display)!important;color:var(--ink);background:var(--guld-soft);padding:6px 14px;border-radius:999px}
